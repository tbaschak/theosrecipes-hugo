{{- /*
  Emits schema.org/Recipe JSON-LD for a recipe single page.
  Wrapped in <script type="application/ld+json">.
*/ -}}
{{- $page := . -}}
{{- $img := $page.Resources.GetMatch $page.Params.image -}}

{{- /* Ingredients formatted "160g Red Lentils" / "Red Lentils" if no amount. */ -}}
{{- $ingredients := slice -}}
{{- range $page.Params.ingredients -}}
  {{- $line := .name -}}
  {{- if .amount -}}
    {{- $unit := default "" .unit -}}
    {{- if eq $unit "none" -}}{{- $unit = "" -}}{{- end -}}
    {{- $sep := " " -}}
    {{- if eq $unit "none" -}}{{- $sep = "" -}}{{- end -}}
    {{- $line = printf "%v%s%s %s" .amount $sep $unit .name -}}
  {{- end -}}
  {{- $ingredients = $ingredients | append $line -}}
{{- end -}}

{{- /* Instructions: take <li>…</li> blocks and turn each into a HowToStep. */ -}}
{{- $instructions := slice -}}
{{- range findRE "(?s)<ol[^>]*>.*?</ol>" $page.Content -}}
  {{- range findRE "(?s)<li>(.*?)</li>" . -}}
    {{- $text := replaceRE "(?s)</?li>" "" . -}}
    {{- $text = replaceRE "<[^>]+>" "" $text -}}
    {{- $text = trim $text " \r\n\t" -}}
    {{- if $text -}}
      {{- $instructions = $instructions | append (dict "@type" "HowToStep" "text" $text) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- $diet := $page.Params.diet -}}
{{- $dietMap := dict "vegan" "https://schema.org/VeganDiet" "vegetarian" "https://schema.org/VegetarianDiet" -}}
{{- $suitableForDiet := "" -}}
{{- with $diet -}}{{- $suitableForDiet = index $dietMap . -}}{{- end -}}
{{- $prepMinutes := int (default 0 $page.Params.prepTime) -}}
{{- $cookMinutes := int $page.Params.cookTime -}}
{{- $keywords := slice -}}
{{- range $page.Params.categories -}}{{- $keywords = $keywords | append . -}}{{- end -}}
{{- with $diet -}}{{- $keywords = $keywords | append . -}}{{- end -}}
{{- $imageUrls := slice -}}
{{- if $img -}}{{- $imageUrls = $imageUrls | append $img.Permalink -}}{{- end -}}
{{- range $page.Params.processImages -}}
  {{- with $page.Resources.GetMatch .image -}}
    {{- if not (in $imageUrls .Permalink) -}}{{- $imageUrls = $imageUrls | append .Permalink -}}{{- end -}}
  {{- end -}}
{{- end -}}

{{- $data := dict
  "@context"           "https://schema.org"
  "@type"              "Recipe"
  "name"               $page.Title
  "description"        (default (i18n "meta.description.recipe" (dict "name" $page.Title)) $page.Params.description)
  "datePublished"      ($page.Date.Format "2006-01-02T15:04:05Z07:00")
  "inLanguage"         $page.Language.Lang
  "recipeYield"        (default "2 servings" $page.Params.recipeYield)
  "totalTime"          (printf "PT%dM" (add $prepMinutes $cookMinutes))
  "cookTime"           (printf "PT%dM" $cookMinutes)
  "prepTime"           (printf "PT%dM" $prepMinutes)
  "recipeIngredient"   $ingredients
  "recipeInstructions" $instructions
  "url"                $page.Permalink
  "image"              $imageUrls
  "keywords"           $keywords
-}}
{{- with $suitableForDiet -}}{{- $data = merge $data (dict "suitableForDiet" .) -}}{{- end -}}
<script type="application/ld+json">{{ $data | jsonify | safeJS }}</script>
