"home.about.sectiontitle" = "About Theos Recipes"
"home.about.introduction" = "I'm Theodore Baschak, and welcome to my food blog. I live in Winnipeg, Manitoba, Canada, and learned to cook from my parents, my wife, and cooking shows. My wife has inspired my passion for food and introduced me to many cuisines."
"home.about.mission"      = "I'm a full-time IT guy trying to cook more often. I develop recipes by learning from other cooks and recipes, then recording what works in my own kitchen. This site shares those recipes without the ads and extra clutter found on many recipe websites."
"home.about.winnipeg"     = 'For ingredients in Winnipeg, I have had good luck at local Sobeys stores and at <a href="https://www.dinosgrocerymart.com/">Dino’s Grocery Mart</a> on Notre Dame Avenue. Local ethnic grocery stores are also great places to find unfamiliar ingredients and ask for advice.'
"home.about.authorImageAlt" = "Theodore Baschak"
"home.about.cta"          = 'Want to stay up to date? Subscribe to our <a href="/rss/">RSS feed</a> with your favorite reader.'

